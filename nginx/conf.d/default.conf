# ============================================================
# 智法通 - Nginx 站点配置
# 说明: 定义HTTP/HTTPS服务器块，反向代理和静态文件服务
# ============================================================

# ----------------------------------------------------------
# HTTP服务器 - 重定向到HTTPS（生产环境启用）
# ----------------------------------------------------------
server {
    listen 80;
    server_name _;

    # 如果启用了HTTPS，将HTTP请求重定向到HTTPS
    # 取消下面注释即可启用
    # return 301 https://$host$request_uri;

    # ----------------------------------------------------------
    # 安全响应头配置
    # ----------------------------------------------------------
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: wss:;" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # ----------------------------------------------------------
    # 前端静态文件服务
    # ----------------------------------------------------------
    location / {
        root /usr/share/nginx/html;
        index index.html;
        # SPA路由支持：所有未匹配的路径都返回index.html
        try_files $uri $uri/ /index.html;

        # 静态资源缓存策略
        # JS/CSS文件：包含hash，长期缓存
        location ~* \.(js|css)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
        # 图片/字体文件：中期缓存
        location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 6M;
            add_header Cache-Control "public";
        }
        # HTML文件：不缓存，确保更新及时生效
        location ~* \.html$ {
            expires -1;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
    }

    # ----------------------------------------------------------
    # 后端API反向代理
    # ----------------------------------------------------------
    location /api/ {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;

        # 传递客户端真实信息
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 代理超时配置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 120s;

        # API限流（突发允许20个请求，不延迟）
        limit_req zone=api_limit burst=20 nodelay;
        limit_conn conn_limit 20;

        # 禁用代理缓冲，确保API响应实时传输
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # ----------------------------------------------------------
    # SSE（Server-Sent Events）流式回答支持
    # 用于AI实时流式输出回答内容
    # ----------------------------------------------------------
    location /api/v1/qa/ask/stream {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;

        # SSE必需：禁止Nginx缓冲响应
        proxy_buffering off;
        proxy_cache off;

        # SSE必需：清除Connection头，保持长连接
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Accel-Buffering no;

        # 启用分块传输编码，确保流式数据实时传输
        chunked_transfer_encoding on;

        # SSE长连接超时设置（5分钟）
        proxy_read_timeout 300s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;

        # SSE响应头
        add_header X-Accel-Buffering no;
        add_header Cache-Control no-cache;
        add_header Content-Type text/event-stream;
    }

    # ----------------------------------------------------------
    # WebSocket 支持
    # 用于实时通信功能
    # ----------------------------------------------------------
    location /api/ws/ {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;

        # WebSocket必需：Upgrade头
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket超时设置（1小时）
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ----------------------------------------------------------
    # 健康检查端点（不记录日志）
    # ----------------------------------------------------------
    location /health {
        access_log off;
        return 200 '{"status":"ok","service":"zhifatong-nginx"}';
        add_header Content-Type application/json;
    }

    # ----------------------------------------------------------
    # 禁止访问隐藏文件（如.git、.env等）
    # ----------------------------------------------------------
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ----------------------------------------------------------
    # 错误页面配置
    # ----------------------------------------------------------
    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}

