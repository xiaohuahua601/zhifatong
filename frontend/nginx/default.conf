# ============================================================
# 智法通 - 前端Nginx站点配置（反向代理 + 负载均衡 + SSE流式支持）
# 功能: 静态文件服务 + SPA路由 + API反向代理 + 负载均衡 + 安全头
#
# 设计要点:
#   1. 使用 resolver 动态解析 backend 主机名，避免启动时 DNS 解析失败
#   2. 通过 upstream 块定义负载均衡池，支持多实例水平扩展
#   3. 使用 max_fails/fail_timeout 实现被动健康检查，自动剔除故障节点
#   4. keepalive 长连接复用，减少TCP握手开销
#   5. 启动时通过 start.sh 脚本等待 backend 可达，进一步保障启动顺序
# ============================================================

# Docker 内置 DNS 服务器（127.0.0.11），用于动态解析容器服务名
# valid=10s 表示缓存DNS结果10秒，过期后重新解析（支持容器扩缩容时自动更新）
resolver 127.0.0.11 valid=10s ipv6=off;

# ----- 负载均衡上游池 -----
# 多后端实例轮询分发，自动健康检查
# 开发环境单实例：仅 backend:8000
# 生产环境多实例：取消注释 backend2/backend3 行，并在 docker-compose.yml 中定义
upstream zhifatong_backend {
    # 轮询策略（默认）：请求均匀分发到各后端实例
    # 最少连接策略（适合AI推理场景）：least_conn;
    # IP哈希策略（会话保持）：ip_hash;

    server backend:8000 max_fails=3 fail_timeout=30s;
    # 生产环境水平扩展（在 docker-compose.yml 中添加 backend2/backend3 服务）：
    # server backend2:8000 max_fails=3 fail_timeout=30s;
    # server backend3:8000 max_fails=3 fail_timeout=30s;

    # 保持长连接复用，减少TCP握手开销
    keepalive 32;
}

server {
    listen 80;
    server_name localhost;

    # ----------------------------------------------------------
    # 字符编码：确保HTML/响应均以UTF-8输出，修复中文标题乱码
    # ----------------------------------------------------------
    charset utf-8;
    charset_types text/css text/plain text/xml application/json application/javascript text/javascript image/svg+xml;

    # ----------------------------------------------------------
    # 安全响应头
    # ----------------------------------------------------------
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ----------------------------------------------------------
    # Gzip压缩（提升传输性能）
    # ----------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml
               image/svg+xml font/opentype;

    # ----------------------------------------------------------
    # 前端静态文件根目录
    # ----------------------------------------------------------
    root /usr/share/nginx/html;
    index index.html;

    # ----------------------------------------------------------
    # API反向代理 → 后端FastAPI服务（负载均衡分发到 upstream 池）
    # 路径: /api/* → zhifatong_backend（多后端实例轮询分发）
    # 使用 ^~ 修饰符确保API请求优先匹配，不被静态资源正则location拦截
    # ----------------------------------------------------------
    location ^~ /api/ {
        proxy_pass http://zhifatong_backend;
        proxy_http_version 1.1;
        # 使用 $http_host 而非 $host：前者保留原始端口（如8188），
        # 后者仅含主机名不含端口，会导致FastAPI 307重定向Location丢失端口
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # SSE流式响应支持（法律问答流式输出）
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        # 超时设置（AI推理可能耗时较长）
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # ----------------------------------------------------------
    # 健康检查端点代理（负载均衡健康检查）
    # ----------------------------------------------------------
    location /health {
        proxy_pass http://zhifatong_backend/health;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
    }

    # ----------------------------------------------------------
    # API文档代理（仅开发环境）
    # ----------------------------------------------------------
    location /docs {
        proxy_pass http://zhifatong_backend/docs;
        proxy_set_header Host $http_host;
    }

    location /openapi.json {
        proxy_pass http://zhifatong_backend/openapi.json;
        proxy_set_header Host $http_host;
    }

    # ----------------------------------------------------------
    # SPA路由支持：所有非文件路径返回index.html
    # ----------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ----------------------------------------------------------
    # 静态资源长缓存（带hash的文件可永久缓存）
    # ----------------------------------------------------------
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ----------------------------------------------------------
    # 安全：禁止访问隐藏文件
    # ----------------------------------------------------------
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ----------------------------------------------------------
    # 错误页面
    # ----------------------------------------------------------
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
