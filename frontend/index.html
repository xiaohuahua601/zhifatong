<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- 内联SVG天平图标favicon：无需额外请求外部资源，法律主题天平emoji图标 -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E⚖%3C/text%3E%3C/svg%3E" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- SEO：站点描述，便于搜索引擎抓取平台核心功能 -->
    <meta name="description" content="智法通 - 企业级智能法律顾问平台，提供AI法律问答、智能合同审查、法规案例检索服务" />
    <!-- 移动端浏览器主题色：与平台案卷墨蓝主色调一致 -->
    <meta name="theme-color" content="#11151f" />
    <title>智法通 - 企业级智能法律顾问平台</title>
    <style>
      /* 应用初始化加载占位样式（Vue挂载前显示，挂载后自动被替换） */
      #app-loading {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #11151f;
        color: #c9a962;
        font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
        z-index: 9999;
      }
      #app-loading .loader-spinner {
        width: 44px;
        height: 44px;
        border: 2px solid rgba(201, 169, 98, 0.22);
        border-top-color: #c9a962;
        border-radius: 50%;
        animation: appLoadingSpin 0.9s linear infinite;
        margin-bottom: 20px;
      }
      #app-loading .loader-text {
        font-size: 14px;
        letter-spacing: 6px;
        opacity: 0.85;
        color: #c9a962;
        font-family: 'Noto Serif SC', 'Source Han Serif SC', 'STZhongsong', 'SimSun', Georgia, serif;
      }
      @keyframes appLoadingSpin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <!-- 禁用JavaScript时的降级提示（HTML规范要求noscript含文本内容时必须在body中） -->
    <noscript>
      <div style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#11151f;color:#c9a962;font-family:'PingFang SC','Microsoft YaHei',sans-serif;font-size:16px;">
        智法通需启用 JavaScript 才能正常运行
      </div>
    </noscript>
    <div id="app">
      <!-- 应用初始化加载占位：在Vue挂载前显示，避免白屏 -->
      <div id="app-loading">
        <div class="loader-spinner"></div>
        <div class="loader-text">智法通加载中...</div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
